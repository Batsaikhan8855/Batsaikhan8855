name: Tic-tac-toe

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttt:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Play move
        id: play
        env:
          TITLE: ${{ github.event.issue.title }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          if [[ "$TITLE" =~ ^ttt:\ move\ ([0-8])$ ]]; then
            python scripts/ttt.py move "${BASH_REMATCH[1]}" "$LOGIN"
          else
            echo "Use an issue title like \`ttt: move 4\` (squares 0-8)." > comment.md
          fi
      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file comment.md
          gh issue close "$NUMBER"
          rm comment.md
      - name: Commit board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game assets/ttt
          git diff --cached --quiet && exit 0
          git commit -m "chore: tic-tac-toe move"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
