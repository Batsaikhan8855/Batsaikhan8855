name: Update profile cards

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**]

permissions:
  contents: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Refresh live-site screenshots (daily)
        if: github.event_name != 'schedule' || github.event.schedule == '30 0 * * *'
        run: ./scripts/screenshots.sh
      - run: python scripts/generate.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake.svg?color_snake=#39d353&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
